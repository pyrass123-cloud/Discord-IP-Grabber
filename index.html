<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Discord Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(420px, 100%);
            padding: 32px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        p {
            margin: 0 0 22px;
            color: #aeb8c4;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #0d1117;
            color: white;
            border: 1px solid #30363d;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #5865f2;
        }

        .consent {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 15px;
            color: #aeb8c4;
            font-size: 13px;
            line-height: 1.4;
            text-align: left;
        }

        .consent input {
            width: auto;
            margin-top: 2px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 16px;
            background: #5865f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            min-height: 22px;
            margin-top: 16px;
            font-size: 14px;
        }

        .success {
            color: #3fb950;
        }

        .error {
            color: #f85149;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1 id="title">Discord Verification</h1>

        <p id="description">
            Enter your Discord username to verify.
        </p>

        <form id="verification-form">
            <input
                id="discord-name"
                type="text"
                placeholder="Discord username"
                minlength="2"
                maxlength="64"
                autocomplete="off"
                required
            >

            <label class="consent">
                <input
                    id="consent-checkbox"
                    type="checkbox"
                    required
                >

                <span>
                    I understand that my Discord username and IP address
                    will be sent to the server's private verification channel.
                </span>
            </label>

            <button id="verify-button" type="submit">
                Verify
            </button>
        </form>

        <div id="status"></div>
    </main>

    <script src="grabip.js"></script>
</body>
</html>
